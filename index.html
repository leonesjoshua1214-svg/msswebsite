<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ISDH Narvacan - Medical Social Service</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* OVERALL BACKGROUND IMAGE */
      background: url('ISDHN.jpg') no-repeat center center/cover;
      position: relative;
    }

    /* DARK OVERLAY FOR BETTER READABILITY */
    body::before{
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }

    .container{
      position: relative;
      z-index: 2;

      text-align: center;
      background: rgba(255,255,255,0.92);
      padding: 40px;
      width: 600px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);

      /* GLASS EFFECT */
      backdrop-filter: blur(5px);
    }

    /* LOGOS */
    .logo-container{
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .logo-container img{
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* TITLE & SUBTITLE */
    .title{
      color: rgb(104, 0, 104);
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle{
      color: rgb(85, 0, 85);
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    /* BUTTONS */
    .button-container{
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .btn{
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover{
      transform: scale(1.03);
    }

    .uis-btn{
      background-color: green;
    }

    .uis-btn:hover{
      background-color: darkgreen;
    }

    .pmrf-btn{
      background-color: blue;
    }

    .pmrf-btn:hover{
      background-color: darkblue;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 700px){

      .container{
        width: 90%;
        padding: 30px 20px;
      }

      .title,
      .subtitle{
        font-size: 24px;
      }

      .logo-container img{
        width: 70px;
        height: 70px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGOS -->
    <div class="logo-container">
      <!-- Replace with your logo file names -->
      <img src="ISDHN LOGO2.jpg" alt="Logo 1">
      <img src="MSS LOGO2.jpg" alt="Logo 2">
    </div>

    <!-- TITLE -->
    <div class="title">
      Ilocos Sur District Hospital Narvacan
    </div>

    <!-- SUBTITLE -->
    <div class="subtitle">
      Medical Social Service
    </div>

    <!-- BUTTONS -->
    <div class="button-container">

      <button class="btn uis-btn">
        Unified Intake Sheet (UIS)
      </button>

      <a href="pmrf.html">
  <button class="btn pmrf-btn">
    PhilHealth Member Registration Form (PMRF)
  </button>

    </div>

  </div>

</body>
</html>
